# Public edge for the Cloudflare tunnel: only Telegram's webhook gets through to n8n.
# The n8n UI, its REST API and the reminders webhook stay reachable from 127.0.0.1 only.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;          # Telegram updates are small JSON; files are fetched by n8n itself

    location = /webhook/telegram {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
